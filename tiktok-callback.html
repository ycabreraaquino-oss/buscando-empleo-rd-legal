<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Autorización recibida — Buscando Empleo RD</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; max-width: 560px; margin: 80px auto; padding: 0 24px; color: #0B1F4B; text-align: center; }
  h1 { font-size: 22px; }
  #codigo { font-family: monospace; font-size: 15px; background: #FAF8F4; border: 1px solid #ddd; border-radius: 8px; padding: 16px; word-break: break-all; margin-top: 24px; user-select: all; }
  button { margin-top: 16px; background: #D31F2E; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-size: 15px; cursor: pointer; }
  p.aviso { color: #16326E; font-size: 14px; }
</style>
</head>
<body>
<h1>Autorización recibida</h1>
<p>Copia este código y pégalo donde te lo esté pidiendo la terminal:</p>
<div id="codigo">(leyendo...)</div>
<button onclick="copiar()">Copiar código</button>
<p class="aviso" id="aviso"></p>
<script>
  const parametros = new URLSearchParams(window.location.search);
  const codigo = parametros.get('code');
  document.getElementById('codigo').textContent = codigo || '(no llego ningun codigo en la URL)';

  function copiar() {
    navigator.clipboard.writeText(codigo || '');
    document.getElementById('aviso').textContent = 'Copiado.';
  }
</script>
</body>
</html>
